[repository]
name = "UltraEdge"
authors = ["wilf"]
[UltraEdge]
description = "Exposed hot edges/corners, second push and 2/3/4-finger edge gestures"
authors = ["wilf"]
output = "build/libUltraEdge.so"
build = ["cmake -S . -B build -DCMAKE_BUILD_TYPE=Release", "cmake --build build -j $(nproc)", "ctest --test-dir build --output-on-failure"]
